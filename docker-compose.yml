services:
  scpods-api:
    container_name: scpods-api
    build:
      context: ./
      dockerfile: Dockerfile
    image: willcq97/scpods-api
    ports:
      - 8080:8080
    environment:
      POSTGRES_SERVER_NAME: postgis-acoes-db
      POSTGRES_SERVER_PORT: 5432
      POSTGRES_DATABASE: acoes_db
    networks:
      - scpods-network

  postgis-acoes-db:
    container_name: postgis-acoes-db
    image: docker.io/postgis/postgis:16-3.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: acoes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin.123
    networks:
      - scpods-network

networks:
  scpods-network:
    driver: bridge
